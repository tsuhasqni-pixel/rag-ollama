name: Offline RAG Windows QA
on:
  push:
    branches: [codex/offline-products-20261024]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no-AI retrieval
        shell: pwsh
        run: |
          python -m compileall -q server.py
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }
          python -m unittest discover -s tests -p test_rag.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Local RAG search QA failed' }
